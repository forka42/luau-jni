# Builds and tests luau-jni on each platform; a tag (v1.2.3) also makes a GitHub release of its jars: luau-jni-1.2.3.jar,
# its sources, and luau-jni-natives-<platform>-1.2.3.jar for each platform, with SHA256SUMS.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64 }
          # (Ubuntu 22.04: its glibc, 2.35, the oldest the Linux library needs.)
          - { os: ubuntu-22.04, platform: linux-x64 }
          - { os: ubuntu-22.04-arm, platform: linux-arm64 }
          - { os: macos-latest, platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then echo "VERSION_ARG=-Pversion=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - name: Build and test
        shell: bash
        # (Through bash: committed from Windows, gradlew may not be marked executable.)
        run: bash ./gradlew build --console=plain $VERSION_ARG
      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: build/libs/luau-jni-natives-*.jar
          if-no-files-found: error
      # (The Java jars from one platform's build: they're the same on every one.)
      - if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: java
          path: build/libs/luau-jni-[0-9]*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: natives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd jars
          sha256sum *.jar > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes *.jar SHA256SUMS
